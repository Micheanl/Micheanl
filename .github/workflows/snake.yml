name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dahan8473/snake-and-commits@v1
        with:
          github_user: Micheanl
          output: dist/berry-snake.svg
          theme: matrix
          frame: true
          counter: true
      - name: Clean counter label
        run: sed -i 's/\$ commits eaten:/commits eaten:/' dist/berry-snake.svg
      - name: Keep snake visible with reduced motion
        run: "sed -i 's/animation:none !important/animation-duration: 60s !important/' dist/berry-snake.svg"
      - name: Create light and dark variants
        run: |
          cp dist/berry-snake.svg dist/berry-snake-light.svg
          cp dist/berry-snake.svg dist/berry-snake-dark.svg
      - name: Apply red palette
        run: |
          for file in dist/berry-snake.svg dist/berry-snake-light.svg dist/berry-snake-dark.svg; do
            sed -i 's/#0a0f0a/#1c0606/g; s/#0d3d1a/#450a0a/g; s/#12742f/#7f1d1d/g; s/#1fb84e/#b91c1c/g; s/#39ff7a/#ff5a5a/g; s/#d6ffe4/#fee2e2/g; s/#3fa060/#fca5a5/g; s/#123d1f/#611420/g' "$file"
          done
      - name: Add light red gradient
        run: |
          sed -i 's/#1c0606/transparent/g; s/#fca5a5/url(#snake-label-light)/g' dist/berry-snake-light.svg
          sed -i 's|<style>|<defs><linearGradient id="snake-bg-light" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="771" y2="0"><stop offset="0%" stop-color="#fff1f1"/><stop offset="45%" stop-color="#f9d3d3"/><stop offset="100%" stop-color="#d08a8a"/></linearGradient><linearGradient id="snake-label-light" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="771" y2="0"><stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#7f1d1d"/></linearGradient></defs><rect width="771" height="151" rx="12" fill="url(#snake-bg-light)"/><style>|' dist/berry-snake-light.svg
          sed -i 's|</style>|</style><style>.cnt { fill:url(#snake-label-light); }</style>|' dist/berry-snake-light.svg
      - name: Add dark red gradient
        run: |
          sed -i 's/#1c0606/transparent/g; s/#fca5a5/url(#snake-label-dark)/g' dist/berry-snake-dark.svg
          sed -i 's|<style>|<defs><linearGradient id="snake-bg-dark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="771" y2="0"><stop offset="0%" stop-color="#af3d47"/><stop offset="38%" stop-color="#871f29"/><stop offset="70%" stop-color="#631223"/><stop offset="100%" stop-color="#1c0606"/></linearGradient><linearGradient id="snake-label-dark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="771" y2="0"><stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/></linearGradient></defs><rect width="771" height="151" rx="12" fill="url(#snake-bg-dark)"/><style>|' dist/berry-snake-dark.svg
          sed -i 's|</style>|</style><style>.cnt { fill:url(#snake-label-dark); }</style>|' dist/berry-snake-dark.svg
          cp dist/berry-snake-dark.svg dist/berry-snake.svg
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Purge jsDelivr cache
        run: curl -s https://purge.jsdelivr.net/gh/Micheanl/Micheanl@output/berry-snake.svg
