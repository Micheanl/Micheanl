name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dahan8473/snake-and-commits@v1
        with:
          github_user: Micheanl
          output: dist/berry-snake.svg
          theme: matrix
          frame: true
          counter: true
      - name: Clean counter label
        run: sed -i 's/\$ commits eaten:/commits eaten:/' dist/berry-snake.svg
      - name: Keep snake visible with reduced motion
        run: "sed -i 's/animation:none !important/animation-duration: 60s !important/' dist/berry-snake.svg"
      - name: Apply berry palette
        run: "sed -i 's/#0a0f0a/#0e0512/g; s/#0d3d1a/#210a1e/g; s/#12742f/#3b102f/g; s/#1fb84e/#641849/g; s/#39ff7a/#c9368a/g; s/#d6ffe4/#ffd6ef/g; s/#3fa060/#d998c0/g; s/#123d1f/#4d1a3a/g' dist/berry-snake.svg"
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Purge jsDelivr cache
        run: curl -s https://purge.jsdelivr.net/gh/Micheanl/Micheanl@output/berry-snake.svg
